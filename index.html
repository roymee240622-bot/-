<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขนมบ้านใบเตย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfdfb;--surface:#fff;--ink:#1c2b22;--mute:#5f7366;--line:#dfeae2;--g:#2f8f5b;--gd:#1f6b42;--gl:#e7f4ec;--warn:#c0392b;--sh:0 1px 2px rgba(20,60,35,.06),0 6px 20px rgba(20,60,35,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1812;--surface:#16231a;--ink:#e6f2ea;--mute:#96ab9d;--line:#27382c;--g:#4fb57e;--gd:#7fd3a3;--gl:#1b3023;--warn:#ff8a7a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1812;--surface:#16231a;--ink:#e6f2ea;--mute:#96ab9d;--line:#27382c;--g:#4fb57e;--gd:#7fd3a3;--gl:#1b3023;--warn:#ff8a7a;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{font-weight:600;font-size:1.25rem;color:var(--gd);display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.1rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:9px 20px;background:var(--g);color:#fff;font-weight:500}
.btn:hover{background:var(--gd)}
.btn.ghost{background:transparent;color:var(--gd);border:1.5px solid var(--g)}
.btn.ghost:hover{background:var(--gl)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.del{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
.hero{padding:44px 0 24px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.25;margin:0 0 10px;font-weight:600;max-width:16em}
.hero p{margin:0;color:var(--mute);max-width:34em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.pic{height:130px;background:var(--gl);display:grid;place-items:center;font-size:3.4rem}
.cb{padding:14px 16px 16px}
.tag{display:inline-block;font-size:.78rem;color:var(--gd);background:var(--gl);border-radius:6px;padding:1px 9px}
.cb h3{margin:8px 0 2px;font-size:1.05rem;font-weight:500}
.cb p{margin:0;color:var(--mute);font-size:.88rem}
.price{margin-top:10px;font-size:1.3rem;font-weight:600;color:var(--gd)}
.price small{font-size:.8rem;color:var(--mute);font-weight:400}
.out{opacity:.55}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
/* seller panel */
dialog{border:0;border-radius:18px;padding:0;width:min(940px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,18,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:var(--g);color:#fff;position:sticky;top:0}
.dh h2{margin:0;font-size:1.15rem;font-weight:500}
.x{background:transparent;border:0;color:#fff;font-size:1.6rem;line-height:1}
.db{padding:20px 22px 26px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum b{display:block;font-size:1.3rem;color:var(--gd);font-weight:600}
.sum span{font-size:.82rem;color:var(--mute)}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.live{grid-column:1/-1;font-size:.88rem;color:var(--gd)}
.row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--gl);color:var(--gd);font-weight:500}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.good{color:var(--g);font-weight:500}.bad{color:var(--warn);font-weight:500}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand"><span class="logo" aria-hidden="true">🍃</span>ขนมบ้านเตชิ</div>
  <button class="btn" id="open">จัดการสินค้า (แม่ค้า)</button>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>ขนมวางขายในออฟฟิศ</h1>
  </section>
  <div class="chips" id="chips" role="group" aria-label="กรองตามชนิดขนม"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h2 id="dt">จัดการสินค้า</h2><button class="x" id="close" aria-label="ปิด">×</button></div>
  <div class="db">
    <div class="sum" id="sum"></div>
    <form id="f" autocomplete="off">
      <label>ชื่อขนม<input id="name" required placeholder="เช่น ขนมครก"></label>
      <label>ชนิด<input id="type" required list="types" placeholder="เช่น ขนมหวาน"><datalist id="types"></datalist></label>
      <label>ราคาขาย (บาท)<input id="price" type="number" min="0" step="0.5" required></label>
      <label>ต้นทุน (บาท)<input id="cost" type="number" min="0" step="any" required></label>
      <label>หน่วย<input id="unit" value="ชิ้น" placeholder="ชิ้น / กล่อง"></label>
      <label>จำนวนคงเหลือ<input id="stock" type="number" min="0" step="1" value="0"></label>
      <label>ไอคอน<select id="icon"></select></label>
      <div class="live" id="live" aria-live="polite"></div>
      <div class="row"><button class="btn" type="submit" id="save">เพิ่มสินค้า</button><button class="btn ghost" type="button" id="cancel" hidden>ยกเลิกการแก้ไข</button></div>
    </form>
    <div class="tw"><table>
      <thead><tr><th>ขนม</th><th>ชนิด</th><th class="n">ราคาขาย</th><th class="n">ต้นทุน</th><th class="n">กำไร/หน่วย</th><th class="n">กำไร %</th><th class="n">คงเหลือ</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </div>
</dialog>

<script>
var KEY='snack-shop-v1';
var SEED=[
 {id:1,name:'ขนมครกใบเตย',type:'ขนมหวาน',price:25,cost:11,unit:'กล่อง',stock:20,icon:'🥥'},
 {id:2,name:'ฝอยทอง',type:'ขนมหวาน',price:30,cost:14,unit:'ห่อ',stock:15,icon:'🍯'},
 {id:3,name:'กล้วยทอด',type:'ของทอด',price:20,cost:8,unit:'ถุง',stock:30,icon:'🍌'},
 {id:4,name:'ข้าวเกรียบกุ้ง',type:'ขนมกรอบ',price:35,cost:17,unit:'ถุง',stock:0,icon:'🍘'},
 {id:5,name:'ขนมถ้วย',type:'ขนมนึ่ง',price:15,cost:6,unit:'ถ้วย',stock:40,icon:'🍮'}];
var ICONS=['🥥','🍯','🍌','🍘','🍮','🍡','🍪','🥮','🍠','🍰'];
var items=load(),filter='ทั้งหมด',editId=null;
function load(){try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}return SEED.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function baht(n){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:2})}
function types(){var t=[];items.forEach(function(i){if(t.indexOf(i.type)<0)t.push(i.type)});return t}

function render(){
  var ts=['ทั้งหมด'].concat(types());
  if(ts.indexOf(filter)<0)filter='ทั้งหมด';
  $('chips').innerHTML=ts.map(function(t){return '<button class="chip" aria-pressed="'+(t===filter)+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('');
  var list=items.filter(function(i){return filter==='ทั้งหมด'||i.type===filter});
  $('grid').innerHTML=list.length?list.map(function(i){
    return '<article class="card'+(i.stock<=0?' out':'')+'"><div class="pic" aria-hidden="true">'+i.icon+'</div><div class="cb"><span class="tag">'+esc(i.type)+'</span><h3>'+esc(i.name)+'</h3><p>'+(i.stock>0?'เหลือ '+i.stock+' '+esc(i.unit):'สินค้าหมด')+'</p><div class="price">฿'+baht(i.price)+' <small>/ '+esc(i.unit)+'</small></div></div></article>'}).join(''):'<div class="empty">ยังไม่มีขนมในหมวดนี้ กด “จัดการสินค้า” เพื่อเพิ่มขนม</div>';
  $('types').innerHTML=types().map(function(t){return '<option value="'+esc(t)+'">'}).join('');
  var tot=0,val=0;items.forEach(function(i){tot+=(i.price-i.cost)*i.stock;val+=i.cost*i.stock});
  $('sum').innerHTML='<div><b>'+items.length+'</b><span>รายการขนม</span></div><div><b>฿'+baht(val)+'</b><span>มูลค่าต้นทุนที่มีในสต็อก</span></div><div><b>฿'+baht(tot)+'</b><span>กำไรถ้าขายหมดสต็อก</span></div>';
  $('tb').innerHTML=items.length?items.map(function(i){
    var p=i.price-i.cost,pc=i.price>0?p/i.price*100:0;
    return '<tr><td>'+i.icon+' '+esc(i.name)+'</td><td>'+esc(i.type)+'</td><td class="n">฿'+baht(i.price)+'</td><td class="n">฿'+baht(i.cost)+'</td><td class="n '+(p>=0?'good':'bad')+'">฿'+baht(p)+'</td><td class="n '+(p>=0?'good':'bad')+'">'+pc.toFixed(0)+'%</td><td class="n">'+i.stock+' '+esc(i.unit)+'</td><td class="n"><button class="btn ghost sm" data-e="'+i.id+'">แก้ไข</button> <button class="btn del sm" data-d="'+i.id+'">ลบ</button></td></tr>'}).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--mute)">ยังไม่มีสินค้า เริ่มเพิ่มขนมจากฟอร์มด้านบน</td></tr>';
}
function live(){
  var p=parseFloat($('price').value),c=parseFloat($('cost').value);
  $('live').textContent=(isNaN(p)||isNaN(c))?'':'กำไรต่อหน่วย ฿'+baht(p-c)+(p>0?' ('+((p-c)/p*100).toFixed(0)+'%)':'');
}
function reset(){editId=null;$('f').reset();$('unit').value='ชิ้น';$('stock').value=0;$('icon').selectedIndex=0;$('save').textContent='เพิ่มสินค้า';$('cancel').hidden=true;live()}

$('icon').innerHTML=ICONS.map(function(i){return '<option>'+i+'</option>'}).join('');
$('chips').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){filter=t;render()}};
$('open').onclick=function(){$('dlg').showModal()};
$('close').onclick=function(){$('dlg').close()};
$('price').oninput=$('cost').oninput=live;
$('cancel').onclick=reset;
$('f').onsubmit=function(e){
  e.preventDefault();
  var o={name:$('name').value.trim(),type:$('type').value.trim(),price:parseFloat($('price').value),cost:parseFloat($('cost').value),unit:$('unit').value.trim()||'ชิ้น',stock:parseInt($('stock').value,10)||0,icon:$('icon').value};
  if(editId){items=items.map(function(i){return i.id===editId?Object.assign({id:editId},o):i})}
  else{o.id=Date.now();items.push(o)}
  save();reset();render();
};
$('tb').onclick=function(e){
  var d=e.target.getAttribute('data-d'),ed=e.target.getAttribute('data-e');
  if(d){items=items.filter(function(i){return String(i.id)!==d});save();render()}
  if(ed){var i=items.filter(function(x){return String(x.id)===ed})[0];if(!i)return;
    editId=i.id;$('name').value=i.name;$('type').value=i.type;$('price').value=i.price;$('cost').value=i.cost;$('unit').value=i.unit;$('stock').value=i.stock;$('icon').value=i.icon;
    $('save').textContent='บันทึกการแก้ไข';$('cancel').hidden=false;live();$('name').focus()}
};
render();
</script>
</body>
</html>
