<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขนมบ้านใบเตย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfdfb;--surface:#fff;--ink:#1c2b22;--mute:#5f7366;--line:#dfeae2;--g:#2f8f5b;--gd:#1f6b42;--gl:#e7f4ec;--warn:#c0392b;--sh:0 1px 2px rgba(20,60,35,.06),0 6px 20px rgba(20,60,35,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1812;--surface:#16231a;--ink:#e6f2ea;--mute:#96ab9d;--line:#27382c;--g:#4fb57e;--gd:#7fd3a3;--gl:#1b3023;--warn:#ff8a7a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1812;--surface:#16231a;--ink:#e6f2ea;--mute:#96ab9d;--line:#27382c;--g:#4fb57e;--gd:#7fd3a3;--gl:#1b3023;--warn:#ff8a7a;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{font-weight:600;font-size:1.25rem;color:var(--gd);display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.1rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:9px 20px;background:var(--g);color:#fff;font-weight:500}
.btn:hover{background:var(--gd)}
.btn.ghost{background:transparent;color:var(--gd);border:1.5px solid var(--g)}
.btn.ghost:hover{background:var(--gl)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.del{background:transparent;color:var(--warn);border:1.5px solid var(--line)}
.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.25;margin:0 0 10px;font-weight:600;max-width:16em}
.stat{margin:0;font-size:.85rem;color:var(--mute);min-height:1.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.pic{height:130px;background:var(--gl);display:grid;place-items:center;font-size:3.4rem}
.cb{padding:14px 16px 16px}
.tag{display:inline-block;font-size:.78rem;color:var(--gd);background:var(--gl);border-radius:6px;padding:1px 9px}
.cb h3{margin:8px 0 2px;font-size:1.05rem;font-weight:500}
.cb p{margin:0;color:var(--mute);font-size:.88rem}
.price{margin-top:10px;font-size:1.3rem;font-weight:600;color:var(--gd)}
.price small{font-size:.8rem;color:var(--mute);font-weight:400}
.out{opacity:.55}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:18px;padding:0;width:min(940px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,18,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:var(--g);color:#fff;position:sticky;top:0}
.dh h2{margin:0;font-size:1.15rem;font-weight:500}
.x{background:transparent;border:0;color:#fff;font-size:1.6rem;line-height:1}
.db{padding:20px 22px 26px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum b{display:block;font-size:1.3rem;color:var(--gd);font-weight:600}
.sum span{font-size:.82rem;color:var(--mute)}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.live{grid-column:1/-1;font-size:.88rem;color:var(--gd)}
.row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--gl);color:var(--gd);font-weight:500}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.good{color:var(--g);font-weight:500}.bad{color:var(--warn);font-weight:500}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand"><span class="logo" aria-hidden="true">🍃</span>ขนมบ้านเตชิ</div>
  <button class="btn" id="open">จัดการสินค้า (แม่ค้า)</button>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>ขนมวางขายในออฟฟิศ</h1>
    <p class="stat" id="stat" aria-live="polite">กำลังโหลดข้อมูล...</p>
  </section>
  <input id="sq" type="search" placeholder="🔍 ค้นหาขนม (ชื่อหรือชนิด)" aria-label="ค้นหาขนม" style="max-width:360px;margin-top:18px">
  <div class="chips" id="chips" role="group" aria-label="กรองตามชนิดขนม"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h2 id="dt">จัดการสินค้า</h2><button class="x" id="close" aria-label="ปิด">×</button></div>
  <div class="db">
    <div class="sum" id="sum"></div>
    <form id="f" autocomplete="off">
      <label>ชื่อขนม<input id="name" required placeholder="เช่น ขนมครก"></label>
      <label>ชนิด<input id="type" required list="types" placeholder="เช่น ขนมหวาน"><datalist id="types"></datalist></label>
      <label>ราคาขาย (บาท)<input id="price" type="number" min="0" step="0.5" required></label>
      <label>ต้นทุน (บาท)<input id="cost" type="number" min="0" step="any" required></label>
      <label>หน่วย<input id="unit" value="ชิ้น" placeholder="ชิ้น / กล่อง"></label>
      <label>จำนวนคงเหลือ<input id="stock" type="number" min="0" step="1" value="0"></label>
      <label>วันที่วางขาย<input id="date" type="date"></label>
      <label>ไอคอน<select id="icon"></select></label>
      <div class="live" id="live" aria-live="polite"></div>
      <div class="row"><button class="btn" type="submit" id="save">เพิ่มสินค้า</button><button class="btn ghost" type="button" id="cancel" hidden>ยกเลิกการแก้ไข</button></div>
    </form>
    <input id="q" type="search" placeholder="🔍 ค้นหาสินค้า (ชื่อหรือชนิด)" style="margin-top:18px" aria-label="ค้นหาสินค้า">
    <div class="tw"><table>
      <thead><tr><th>ขนม</th><th>ชนิด</th><th class="n">ราคาขาย</th><th class="n">ต้นทุน</th><th class="n">กำไร/หน่วย</th><th class="n">กำไร %</th><th class="n">คงเหลือ</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </div>
</dialog>

<script>
/* ===== ตั้งค่า: URL ของ Google Apps Script (ลงท้ายด้วย /exec) ===== */
var SHEET_URL='https://script.google.com/macros/s/AKfycbw3dnWnVvJ4x3mwTm-l-at26FKfYDf1op6q_Jhmbv-y1nJyNODydZMdIqVfzPCT-jr0/exec';
/* ================================================================== */
var CACHE='snack-shop-cache-v1';
var ICONS=['🥥','🍯','🍌','🍘','🍮','🍡','🍪','🥮','🍠','🍰'];
var items=loadLocal(),filter='ทั้งหมด',editId=null,loaded=false,KEY='';
var pushing=false,again=false;
function $(i){return document.getElementById(i)}
function setStat(t,bad){var el=$('stat');if(!el)return;el.textContent=t;el.style.color=bad?'var(--warn)':'var(--mute)'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function baht(n){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:2})}
function fdate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function types(){var t=[];items.forEach(function(i){if(t.indexOf(i.type)<0)t.push(i.type)});return t}
function norm(a){return (Array.isArray(a)?a:[]).map(function(x,n){return{id:x.id||Date.now()+n,name:String(x.name||''),type:x.type||'ทั่วไป',price:+x.price||0,cost:+x.cost||0,unit:x.unit||'ชิ้น',stock:parseInt(x.stock,10)||0,icon:x.icon||'🍪',date:x.date?String(x.date).slice(0,10):''}})}
function loadLocal(){try{var r=localStorage.getItem(CACHE);if(r){var a=JSON.parse(r);if(Array.isArray(a))return norm(a)}}catch(e){}return []}
function saveLocal(){try{localStorage.setItem(CACHE,JSON.stringify(items))}catch(e){}}

/* ติดต่อ Google Apps Script (ส่งเป็น text/plain เพื่อไม่ให้ติด CORS preflight) */
function call(action,payload){
  return fetch(SHEET_URL,{method:'POST',body:JSON.stringify({key:KEY,action:action,items:payload})})
    .then(function(r){return r.json()})
    .then(function(d){if(d.error)throw new Error(d.error);return d});
}
function pull(){
  setStat('กำลังโหลดข้อมูลจากชีต...');
  return call('get').then(function(d){
    items=norm(d.items);loaded=true;saveLocal();render();setStat('');
  }).catch(function(e){
    loaded=true;render();
    setStat('เชื่อมต่อชีตไม่สำเร็จ: '+e.message+(items.length?' (แสดงข้อมูลที่เก็บในเครื่อง)':''),1);
  });
}
function push(){
  if(pushing){again=true;return}
  pushing=true;setStat('กำลังบันทึกลง Google Sheets...');
  call('set',items).then(function(){setStat('บันทึกแล้ว')}).catch(function(e){
    if(String(e.message).indexOf('รหัส')>=0){
      KEY='';$('dlg').close();
      alert('รหัสไม่ถูกต้อง ไม่ได้บันทึกข้อมูล');
      pull();
    }else setStat('บันทึกลงชีตไม่สำเร็จ: '+e.message,1);
  }).then(function(){pushing=false;if(again){again=false;push()}});
}
function save(){saveLocal();push()}

function render(){
  var ts=['ทั้งหมด'].concat(types());
  if(ts.indexOf(filter)<0)filter='ทั้งหมด';
  $('chips').innerHTML=ts.map(function(t){return '<button class="chip" aria-pressed="'+(t===filter)+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('');
  var sq=($('sq').value||'').trim().toLowerCase();
  var list=items.filter(function(i){return (filter==='ทั้งหมด'||i.type===filter)&&(!sq||(i.name+' '+i.type).toLowerCase().indexOf(sq)>=0)});
  var emptyMsg=loaded?'ยังไม่มีขนมวางขายตอนนี้':'';
  $('grid').innerHTML=list.length?list.map(function(i){
    return '<article class="card'+(i.stock<=0?' out':'')+'"><div class="pic" aria-hidden="true">'+i.icon+'</div><div class="cb"><span class="tag">'+esc(i.type)+'</span><h3>'+esc(i.name)+'</h3><p>'+(i.stock>0?'เหลือ '+i.stock+' '+esc(i.unit):'สินค้าหมด')+'</p>'+(i.date?'<p>วางขาย '+fdate(i.date)+'</p>':'')+'<div class="price">฿'+baht(i.price)+' <small>/ '+esc(i.unit)+'</small></div><button class="btn sm" data-s="'+i.id+'" style="margin-top:12px;width:100%"'+(i.stock<=0?' disabled':'')+'>🛒 ขาย</button></div></article>'}).join(''):(emptyMsg?'<div class="empty">'+emptyMsg+'</div>':'');
  $('types').innerHTML=types().map(function(t){return '<option value="'+esc(t)+'">'}).join('');
  var tot=0,val=0,pcs=0;items.forEach(function(i){tot+=(i.price-i.cost)*i.stock;val+=i.cost*i.stock;pcs+=i.stock});
var tt=$('totals');if(!tt){tt=document.createElement('div');tt.id='totals';$('stat').insertAdjacentElement('afterend',tt)}
tt.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 0;max-width:520px';
var bx='background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:14px;padding:12px 18px;box-shadow:var(--sh)';
tt.innerHTML='<div style="'+bx+'"><div style="font-size:.85rem;color:var(--mute)">ต้นทุนทั้งหมด</div><div style="font-size:1.6rem;font-weight:600;color:var(--gd)">฿'+baht(val)+'</div></div><div style="'+bx+'"><div style="font-size:.85rem;color:var(--mute)">ขนมคงเหลือทั้งหมด</div><div style="font-size:1.6rem;font-weight:600;color:var(--gd)">'+pcs+' ชิ้น</div></div>';
  $('sum').innerHTML='<div><b>'+items.length+'</b><span>รายการขนม</span></div><div><b>฿'+baht(val)+'</b><span>มูลค่าต้นทุนที่มีในสต็อก</span></div><div><b>฿'+baht(tot)+'</b><span>กำไรถ้าขายหมดสต็อก</span></div>';
  var qq=($('q').value||'').trim().toLowerCase();
  var tl=items.filter(function(i){return !qq||(i.name+' '+i.type).toLowerCase().indexOf(qq)>=0});
  $('tb').innerHTML=tl.length?tl.map(function(i){
    var p=i.price-i.cost,pc=i.price>0?p/i.price*100:0;
    return '<tr><td>'+i.icon+' '+esc(i.name)+'</td><td>'+esc(i.type)+'</td><td class="n">฿'+baht(i.price)+'</td><td class="n">฿'+baht(i.cost)+'</td><td class="n '+(p>=0?'good':'bad')+'">฿'+baht(p)+'</td><td class="n '+(p>=0?'good':'bad')+'">'+pc.toFixed(0)+'%</td><td class="n">'+i.stock+' '+esc(i.unit)+'</td><td class="n"><button class="btn ghost sm" data-e="'+i.id+'">แก้ไข</button> <button class="btn del sm" data-d="'+i.id+'">ลบ</button></td></tr>'}).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--mute)">ยังไม่มีสินค้า เริ่มเพิ่มขนมจากฟอร์มด้านบน</td></tr>';
}
function live(){
  var p=parseFloat($('price').value),c=parseFloat($('cost').value);
  $('live').textContent=(isNaN(p)||isNaN(c))?'':'กำไรต่อหน่วย ฿'+baht(p-c)+(p>0?' ('+((p-c)/p*100).toFixed(0)+'%)':'');
}
function reset(){editId=null;$('f').reset();$('unit').value='ชิ้น';$('stock').value=0;$('icon').selectedIndex=0;$('save').textContent='เพิ่มสินค้า';$('cancel').hidden=true;live()}

$('icon').innerHTML=ICONS.map(function(i){return '<option>'+i+'</option>'}).join('');
$('chips').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){filter=t;render()}};
$('open').onclick=function(){
  $('dlg').showModal();
};
$('close').onclick=function(){$('dlg').close()};
$('price').oninput=$('cost').oninput=live;
$('sq').oninput=function(){render()};
$('q').oninput=function(){render()};
$('cancel').onclick=reset;
$('f').onsubmit=function(e){
  e.preventDefault();
  var o={name:$('name').value.trim(),type:$('type').value.trim(),price:parseFloat($('price').value),cost:parseFloat($('cost').value),unit:$('unit').value.trim()||'ชิ้น',stock:parseInt($('stock').value,10)||0,icon:$('icon').value,date:$('date').value};
  if(editId){items=items.map(function(i){return i.id===editId?Object.assign({id:editId},o):i})}
  else{o.id=Date.now();items.push(o)}
  save();reset();render();
};
$('tb').onclick=function(e){
  var d=e.target.getAttribute('data-d'),ed=e.target.getAttribute('data-e');
  if(d){if(!confirm('ลบรายการนี้?'))return;items=items.filter(function(i){return String(i.id)!==d});save();render()}
  if(ed){var i=items.filter(function(x){return String(x.id)===ed})[0];if(!i)return;
    editId=i.id;$('name').value=i.name;$('type').value=i.type;$('price').value=i.price;$('cost').value=i.cost;$('unit').value=i.unit;$('stock').value=i.stock;$('icon').value=i.icon;$('date').value=i.date||'';
    $('save').textContent='บันทึกการแก้ไข';$('cancel').hidden=false;live();$('name').focus()}
};

render();
pull();
</script>
<script>
(function(){
var SC='snack-sales-cache-v1',sales=[],sellId=null;
try{sales=JSON.parse(localStorage.getItem(SC))||[]}catch(e){}
function two(n){return('0'+n).slice(-2)}
function ymd(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function saveS(){try{localStorage.setItem(SC,JSON.stringify(sales))}catch(e){}}
function ns(a){return(Array.isArray(a)?a:[]).map(function(s){return{id:String(s.id),date:String(s.date).slice(0,10),itemId:String(s.itemId),name:String(s.name),icon:s.icon||'🍪',unit:s.unit||'ชิ้น',qty:+s.qty||0,price:+s.price||0,cost:+s.cost||0}})}
function warn(e){setStat('บันทึกประวัติขายลงชีตไม่สำเร็จ: '+e.message,1)}

document.body.insertAdjacentHTML('beforeend',
'<dialog id="sd" style="width:min(380px,calc(100% - 24px))"><div class="dh"><h2 id="sdt">บันทึกการขาย</h2><button class="x" id="sdx" aria-label="ปิด">×</button></div><div class="db"><form id="sf" style="grid-template-columns:1fr">'+
'<div class="live" id="sinfo"></div><label>ขายกี่ชิ้น<input id="sqty" type="number" min="1" step="1" value="1" required></label>'+
'<label>วันที่ขาย<input id="sdate" type="date" required></label><div class="live" id="stot"></div>'+
'<div class="row"><button class="btn" type="submit">บันทึกการขาย</button></div></form></div></dialog>'+
'<dialog id="hd"><div class="dh"><h2>ประวัติการขาย</h2><button class="x" id="hdx" aria-label="ปิด">×</button></div><div class="db">'+
'<div class="sum" id="hsum"></div><p class="stat" id="hbest"></p>'+
'<input id="hq" type="search" placeholder="🔍 ค้นหาตามชื่อขนม" aria-label="ค้นหาประวัติ" style="margin-top:12px">'+
'<div class="tw"><table><thead><tr><th>วันที่</th><th>ขนม</th><th class="n">จำนวน</th><th class="n">ราคา</th><th class="n">ยอดขาย</th><th class="n">กำไร</th><th></th></tr></thead><tbody id="htb"></tbody></table></div></div></dialog>');
var ob=$('open'),bw=document.createElement('div');
bw.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end';
ob.parentNode.insertBefore(bw,ob);
bw.appendChild(ob);
bw.insertAdjacentHTML('beforeend','<button class="btn ghost" id="hb">📒 ประวัติการขาย</button>');

function find(id){return items.filter(function(i){return String(i.id)===String(id)})[0]}
function sinfo(){
  var it=find(sellId),q=parseInt($('sqty').value,10)||0;if(!it)return;
  $('sinfo').textContent=it.icon+' '+it.name+' — ราคา ฿'+baht(it.price)+' / '+it.unit+' (เหลือ '+it.stock+')';
  $('stot').textContent=q>0?'ยอดขาย ฿'+baht(it.price*q)+' · กำไร ฿'+baht((it.price-it.cost)*q):'';
}
function drawH(){
  var t=ymd(new Date()),w=new Date();w.setDate(w.getDate()-6);w=ymd(w);var m=t.slice(0,7);
  function sum(f){var r=0,p=0;sales.forEach(function(s){if(f(s)){r+=s.price*s.qty;p+=(s.price-s.cost)*s.qty}});return[r,p]}
  var d=sum(function(s){return s.date===t}),wk=sum(function(s){return s.date>=w}),mo=sum(function(s){return s.date.slice(0,7)===m});
  function box(l,x){return'<div><b>฿'+baht(x[0])+'</b><span>'+l+' · กำไร ฿'+baht(x[1])+'</span></div>'}
  $('hsum').innerHTML=box('วันนี้',d)+box('7 วันล่าสุด',wk)+box('เดือนนี้',mo);
  var q=($('hq').value||'').trim().toLowerCase();
  var list=sales.filter(function(s){return!q||s.name.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(+b.id)-(+a.id)});
  var cnt={};list.forEach(function(s){cnt[s.name]=(cnt[s.name]||0)+s.qty});
  var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,3);
  $('hbest').textContent=top.length?'🏆 ขายดี: '+top.map(function(n){return n+' ('+cnt[n]+')'}).join(' · '):'';
  $('htb').innerHTML=list.length?list.map(function(s){var p=(s.price-s.cost)*s.qty;
    return'<tr><td>'+fdate(s.date)+'</td><td>'+s.icon+' '+esc(s.name)+'</td><td class="n">'+s.qty+' '+esc(s.unit)+'</td><td class="n">฿'+baht(s.price)+'</td><td class="n">฿'+baht(s.price*s.qty)+'</td><td class="n '+(p>=0?'good':'bad')+'">฿'+baht(p)+'</td><td class="n"><button class="btn del sm" data-sd="'+esc(s.id)+'">ลบ</button></td></tr>'}).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--mute)">ยังไม่มีประวัติการขาย</td></tr>';
}
function addBtns(){
  Array.prototype.forEach.call(document.querySelectorAll('#tb button[data-e]'),function(b){
    var s=document.createElement('button');s.className='btn sm';s.setAttribute('data-s',b.getAttribute('data-e'));s.textContent='ขาย';
    b.parentNode.insertBefore(s,b);b.parentNode.insertBefore(document.createTextNode(' '),b);
  });
}
function addLast(){
  Array.prototype.forEach.call(document.querySelectorAll('#grid button[data-s]'),function(b){
    var id=b.getAttribute('data-s'),last='';
    sales.forEach(function(s){if(s.itemId===id&&s.date>last)last=s.date});
    var p=document.createElement('p');
    p.textContent=last?'ขายล่าสุด '+fdate(last):'ยังขายไม่ได้';
    b.parentNode.insertBefore(p,b.parentNode.querySelector('.price'));
  });
}
var r0=render;
render=function(){r0();addBtns();addLast();if($('hd').open)drawH()};

function openSell(e){
  var id=e.target.getAttribute('data-s');if(!id)return;
  var it=find(id);if(!it)return;
  if(it.stock<=0){alert('⚠️ '+it.name+' หมดสต็อกแล้ว ไม่สามารถบันทึกการขายได้');return}
  sellId=id;$('sqty').value=1;$('sdate').value=ymd(new Date());sinfo();$('sd').showModal();$('sqty').select();
}
$('tb').addEventListener('click',openSell);
$('grid').addEventListener('click',openSell);
$('sqty').oninput=sinfo;
$('sdx').onclick=function(){$('sd').close()};
$('sf').onsubmit=function(e){
  e.preventDefault();
  var it=find(sellId),q=parseInt($('sqty').value,10);
  if(!it||!(q>0))return;
  if(q>it.stock){alert('⚠️ ขายเกินสต็อก!\n'+it.name+' เหลือเพียง '+it.stock+' '+it.unit+' แต่กรอก '+q);return}
  var s={id:String(Date.now()),date:$('sdate').value,itemId:String(it.id),name:it.name,icon:it.icon,unit:it.unit,qty:q,price:it.price,cost:it.cost};
  it.stock-=q;sales.push(s);saveS();save();render();$('sd').close();
  call('addSale',[s]).then(function(){setStat('บันทึกการขายแล้ว')}).catch(warn);
};
$('hb').onclick=function(){drawH();$('hd').showModal()};
$('hdx').onclick=function(){$('hd').close()};
$('hq').oninput=drawH;
$('htb').onclick=function(e){
  var id=e.target.getAttribute('data-sd');if(!id)return;
  var s=sales.filter(function(x){return x.id===id})[0];if(!s)return;
  if(!confirm('ลบรายการขาย '+s.name+' x'+s.qty+' ? (จะคืนสต็อกให้)'))return;
  var it=find(s.itemId);if(it){it.stock+=s.qty;save()}
  sales=sales.filter(function(x){return x.id!==id});saveS();render();drawH();
  call('deleteSale',[{id:id}]).catch(warn);
};
call('getSales').then(function(d){sales=ns(d.items);saveS();render()}).catch(function(e){setStat('โหลดประวัติขายไม่สำเร็จ: '+e.message,1)});
render();
})();
</script>
</body>
</html>
